[tools]
python = "3.14.9"
cmake = "4.3.3"
7zip = "26.05"

# Opt into the decompilation toolchain with MISE_ENV=research.

[tasks.setup-linux]
description = "Provision internal Ubuntu/Debian builder and native test dependencies (uses sudo)"
run = "bash scripts/setup-linux.sh"

[tasks.test-linux]
description = "Run all offline tests with builder and native MQTT coverage required"
env = { CLASSE100X_REQUIRE_BUILDER_TOOLS = "1", CLASSE100X_MQTT_LIBRARY = "{{ config_root }}/.local/mqtt-native/mosquitto-1.4.14/lib/libmosquitto.so.1" }
run = "python -m unittest discover -s tests -v"

[tasks.research-setup]
description = "Install offline firmware analysis Python dependencies"
run = ["python -m venv .venv", ".venv/bin/python -m pip install -r requirements-research.txt"]

[tasks.test-builder]
description = "Run offline builder integration tests with locally installed e2fsprogs"
run = "CLASSE100X_REQUIRE_BUILDER_TOOLS=1 python -m unittest discover -s tests -p 'test_builder*.py' -v"

[tasks.transport-build]
description = "Build the locally checked-out TetherKit CLI (requires Homebrew libusb)"
run = [
  "cmake -S research/TetherKit -B .local/tetherkit-build -DCMAKE_BUILD_TYPE=Release -DTETHERKIT_BUILD_TESTS=ON -DTETHERKIT_BUILD_BENCHMARKS=OFF",
  "cmake --build .local/tetherkit-build --parallel 8",
]

[tasks.test]
description = "Run offline tests"
run = "python -m unittest discover -s tests -v"
